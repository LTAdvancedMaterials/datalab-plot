<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 200" width="724" height="200" role="img" aria-label="datalab-plot">
  <title>datalab-plot</title>
  <style>
    .wm { fill: #15273b; }
    @media (prefers-color-scheme: dark) { .wm { fill: #e9eff5; } }
  </style>

  <!-- icon (the logo.svg tile, scaled into a 160x160 box) -->
  <g transform="translate(20 20) scale(0.625)">
    <rect x="8" y="8" width="240" height="240" rx="54" fill="#0e1a2b"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <g stroke="#8ea7bf" stroke-opacity="0.13" stroke-width="2.5">
      <line x1="66" y1="112" x2="206" y2="112"/>
      <line x1="66" y1="156" x2="206" y2="156"/>
    </g>
    <g stroke="#8ea7bf" stroke-opacity="0.4" stroke-width="3.5" stroke-linecap="round">
      <line x1="66" y1="58" x2="66" y2="198"/>
      <line x1="66" y1="198" x2="206" y2="198"/>
    </g>
    <path d="M 78 178 C 100 172 122 156 140 154 C 166 151 184 158 200 152"
          fill="none" stroke="#4ea8de" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 168 C 100 120 122 104 140 102 C 166 99 184 92 200 82"
          fill="none" stroke="#ff7a59" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="82" r="10.5" fill="#0e1a2b"/>
    <circle cx="200" cy="82" r="6" fill="#ffffff"/>
    <circle cx="200" cy="152" r="10.5" fill="#0e1a2b"/>
    <circle cx="200" cy="152" r="6" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="130" font-size="86" font-weight="700" letter-spacing="-2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <tspan class="wm">datalab</tspan><tspan fill="#ff7a59">-plot</tspan>
  </text>
</svg>
