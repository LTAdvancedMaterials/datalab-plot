<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="datalab-plot">
  <title>datalab-plot</title>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#000072"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#E6EAEE" stroke-opacity="0.12"/>
  <!-- gridlines -->
  <g stroke="#E6EAEE" stroke-opacity="0.16" stroke-width="2.5">
    <line x1="66" y1="112" x2="206" y2="112"/>
    <line x1="66" y1="156" x2="206" y2="156"/>
  </g>
  <!-- axes -->
  <g stroke="#E6EAEE" stroke-opacity="0.5" stroke-width="3.5" stroke-linecap="round">
    <line x1="66" y1="58" x2="66" y2="198"/>
    <line x1="66" y1="198" x2="206" y2="198"/>
  </g>
  <!-- discharge trace -->
  <path d="M 78 178 C 100 172 122 156 140 154 C 166 151 184 158 200 152"
        fill="none" stroke="#0083FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- charge trace -->
  <path d="M 78 168 C 100 120 122 104 140 102 C 166 99 184 92 200 82"
        fill="none" stroke="#00FFBA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- endpoint data points -->
  <g>
    <circle cx="200" cy="82" r="10.5" fill="#000072"/>
    <circle cx="200" cy="82" r="6" fill="#FAB400"/>
    <circle cx="200" cy="152" r="10.5" fill="#000072"/>
    <circle cx="200" cy="152" r="6" fill="#FAB400"/>
  </g>
</svg>
